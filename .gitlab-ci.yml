stages:
  - build
  - deploy

variables:
  # Deployment path on the runner
  DEPLOY_PATH: "/home/ec2-user/learning-hub"

# ==============================================================================
# BUILD STAGE: Generate production release zip using npm build:production
# ==============================================================================
build:
  stage: build
  tags:
    - cat-dlp-2
  script:
    # Run the production build script (runs tests, builds Docker images, creates zip)
    - npm run build:production
  artifacts:
    paths:
      - learning-hub-release-*.zip
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_COMMIT_BRANCH
      when: manual

# ==============================================================================
# DEPLOY STAGE: Deploy to development environment
# ==============================================================================
deploy-development:
  stage: deploy
  tags:
    - cat-dlp-2
  dependencies:
    - build
  script:
    # Stop any existing containers
    - |
      if [ -d "$DEPLOY_PATH" ]; then
        echo "Stopping existing deployment..."
        cd "$DEPLOY_PATH"
        docker-compose -f docker-compose.production.yml down || true
      fi
    
    # Clean and prepare deployment directory
    - rm -rf "$DEPLOY_PATH"
    - mkdir -p "$DEPLOY_PATH"
    
    # Find and unzip the release archive
    - |
      RELEASE_ZIP=$(ls -1 learning-hub-release-*.zip | head -n 1)
      echo "Deploying: $RELEASE_ZIP"
      unzip -o "$RELEASE_ZIP" -d "$DEPLOY_PATH"
    
    # Move contents from release subdirectory to deploy path
    - mv "$DEPLOY_PATH/release/"* "$DEPLOY_PATH/"
    - rmdir "$DEPLOY_PATH/release"
    
    # Run the start script
    - cd "$DEPLOY_PATH"
    - chmod +x start.sh
    - ./start.sh
  environment:
    name: development
    url: http://localhost:3000
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_COMMIT_BRANCH
      when: manual
