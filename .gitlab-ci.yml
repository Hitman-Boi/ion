stages:
  - build
  - deploy

variables:
  CI_ENV_FILE: ".env.production"
  TEST_ENV_FILE: ".env.test"

build:
  stage: build
  script:
    - echo "Using environment file: $CI_ENV_FILE"
    - docker build -t my-app-image -f Dockerfile .
  artifacts:
    paths:
      - my-app-image

deploy:
  stage: deploy
  script:
    - docker-compose -f docker-compose.yml up -d
  only:
    - main
